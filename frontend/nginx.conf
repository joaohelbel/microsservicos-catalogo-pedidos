server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/catalog/ {
        proxy_pass http://catalog-service:8000/;
    }

    location /api/orders/ {
        proxy_pass http://order-service:8000/;
    }
}
