apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-orders-ingress
  namespace: catalog-orders
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: catalog.local
      http:
        paths:
          - path: /?(.*)
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
