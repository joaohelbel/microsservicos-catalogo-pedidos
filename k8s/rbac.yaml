apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: catalog-orders
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: catalog-orders
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-rolebinding
  namespace: catalog-orders
subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: catalog-orders
roleRef:
  kind: Role
  name: app-role
  apiGroup: rbac.authorization.k8s.io
