apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: catalog-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: catalog-service
          image: ghcr.io/user/catalog-service:latest
          env:
            - name: DATABASE_URL
              value: postgresql://catalog:catalog@postgres.catalog-orders.svc.cluster.local:5432/catalog_db
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: catalog-orders
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8000
      targetPort: 8000
