apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: catalog-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: worker-service
          image: ghcr.io/user/worker-service:latest
          env:
            - name: REDIS_URL
              value: redis://redis.catalog-orders.svc.cluster.local:6379/0
            - name: QUEUE_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: QUEUE_NAME
          ports:
            - containerPort: 9100
