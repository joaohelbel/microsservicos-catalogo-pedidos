apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: catalog-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: order-service
          image: ghcr.io/user/order-service:latest
          env:
            - name: REDIS_URL
              value: redis://redis.catalog-orders.svc.cluster.local:6379/0
            - name: QUEUE_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: QUEUE_NAME
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: catalog-orders
spec:
  selector:
    app: order-service
  ports:
    - port: 8000
      targetPort: 8000
